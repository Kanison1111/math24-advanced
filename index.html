<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Math 24 Advanced | V0.2</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 28px 16px;
      font-family: system-ui, sans-serif; color: #eaf1ff;
      background: radial-gradient(circle at top, #193657, #0e1727 65%);
    }
    main { max-width: 560px; margin: auto; text-align: center; }
    h1 { color: #77e6f2; margin-bottom: 6px; }
    .subtitle, .note { color: #b3c2d9; }
    .tag { display: inline-block; margin: 18px 0 0; padding: 7px 13px;
      background: #183a43; color: #a2f0d7; border-radius: 40px; font-size: 14px; }
    .numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin: 24px 0; }
    .tile { padding: 20px 2px; background: #233852; border: 2px solid #4a6587;
      border-radius: 14px; font-size: 32px; font-weight: 750; }
    input { width: 100%; padding: 15px 12px; border-radius: 12px; border: 2px solid #55749a;
      background: #17283e; color: white; text-align: center; font-size: 21px; }
    input:focus { outline: 2px solid #77e6f2; outline-offset: 2px; }
    button { cursor: pointer; border: 1px solid #617b9b; border-radius: 10px;
      padding: 12px 14px; font-size: 16px; color: white; background: #263f5c; }
    button:hover { background: #3a5678; }
    .operators, .actions { display: flex; flex-wrap: wrap; gap: 9px;
      justify-content: center; margin: 18px 0; }
    .primary { border-color: #0e91ae; background: #0e91ae; font-weight: 700; }
    #message { min-height: 50px; margin: 20px auto; font-size: 17px; line-height: 1.5; }
    .note { font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <h1>Math 24 Advanced</h1>
    <p class="subtitle">เกมคณิตศาสตร์ 24 สำหรับมัธยมปลาย</p>
    <span class="tag">V0.2 · สุ่มโจทย์ที่มีคำตอบแน่นอน</span>
    <h2>ใช้เลขทั้ง 4 ตัวให้ได้ 24</h2>
    <div class="numbers" id="numbers"></div>
    <input id="answer" aria-label="ช่องพิมพ์คำตอบ" placeholder="เช่น (1+2+3)*4"
      autocomplete="off" spellcheck="false">
    <div class="operators">
      <button onclick="insert('+')">+</button>
      <button onclick="insert('-')">−</button>
      <button onclick="insert('*')">×</button>
      <button onclick="insert('/')">÷</button>
      <button onclick="insert('(')">(</button>
      <button onclick="insert(')')">)</button>
      <button onclick="clearAnswer()">ล้าง</button>
    </div>
    <div class="actions">
      <button class="primary" onclick="checkAnswer()">ตรวจคำตอบ</button>
      <button onclick="newQuestion()">สุ่มโจทย์</button>
      <button onclick="showSolution()">เฉลย</button>
    </div>
    <p id="message" aria-live="polite"></p>
    <p class="note">กติกา: ใช้ตัวเลขแต่ละตัวหนึ่งครั้ง ใช้ + − × ÷ และวงเล็บได้<br>
      ต้องได้ 24 พอดี ไม่อนุญาตให้พิมพ์เลขเพิ่ม</p>
    <p class="note">เวอร์ชันถัดไป: ยกกำลัง · แฟกทอเรียล · รากที่สอง</p>
  </main>
  <script>
    const numberBox = document.getElementById('numbers');
    const input = document.getElementById('answer');
    const message = document.getElementById('message');
    let current = null;

    // เศษส่วนที่คำนวณได้แม่นยำ ไม่ต้องปัดเศษทศนิยม
    function gcd(a, b) {
      a = a < 0n ? -a : a;
      b = b < 0n ? -b : b;
      while (b !== 0n) [a, b] = [b, a % b];
      return a;
    }
    function fraction(n, d = 1n) {
      if (d === 0n) throw Error('ห้ามหารด้วยศูนย์');
      if (d < 0n) { n = -n; d = -d; }
      const g = gcd(n, d);
      return { n: n / g, d: d / g };
    }
    const add = (a, b) => fraction(a.n*b.d+b.n*a.d, a.d*b.d);
    const subtract = (a, b) => fraction(a.n*b.d-b.n*a.d, a.d*b.d);
    const multiply = (a, b) => fraction(a.n*b.n, a.d*b.d);
    const divide = (a, b) => fraction(a.n*b.d, a.d*b.n);
    const is24 = x => x.n === 24n * x.d;

    // Solver: เลือกเลขสองตัวมาคำนวณ แล้วค้นหาต่อจนเหลือค่าเดียว
    function findSolution(numbers) {
      const start = numbers.map(n => ({ value: fraction(BigInt(n)), text: String(n) }));
      function solve(items) {
        if (items.length === 1) return is24(items[0].value) ? items[0].text : null;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i], b = items[j];
            const rest = items.filter((_, k) => k !== i && k !== j);
            const choices = [
              { value: add(a.value,b.value), text: `(${a.text}+${b.text})` },
              { value: subtract(a.value,b.value), text: `(${a.text}-${b.text})` },
              { value: subtract(b.value,a.value), text: `(${b.text}-${a.text})` },
              { value: multiply(a.value,b.value), text: `(${a.text}*${b.text})` }
            ];
            if (b.value.n !== 0n)
              choices.push({ value: divide(a.value,b.value), text: `(${a.text}/${b.text})` });
            if (a.value.n !== 0n)
              choices.push({ value: divide(b.value,a.value), text: `(${b.text}/${a.text})` });
            for (const choice of choices) {
              const result = solve([...rest, choice]);
              if (result !== null) return result;
            }
          }
        }
        return null;
      }
      return solve(start);
    }

    function sameNumbers(a, b) {
      return [...a].sort((x,y)=>x-y).join(',') ===
             [...b].sort((x,y)=>x-y).join(',');
    }
    function newQuestion() {
      let found = null;
      // ตรวจโจทย์ก่อนนำไปแสดง และจำกัดจำนวนครั้งเพื่อไม่ให้หน้าเว็บค้าง
      for (let tries = 0; tries < 200; tries++) {
        const nums = Array.from({length: 4}, () => 1 + Math.floor(Math.random()*9));
        if (current && sameNumbers(nums, current.nums)) continue;
        const solution = findSolution(nums);
        if (solution !== null) { found = {nums, solution}; break; }
      }
      // ชุดสำรองเหล่านี้มีคำตอบแน่นอน
      if (!found) {
        const nums = current && sameNumbers(current.nums, [1,2,3,4])
          ? [4,4,4,4] : [1,2,3,4];
        found = {nums, solution: findSolution(nums)};
      }
      current = found;
      numberBox.replaceChildren();
      for (const n of current.nums) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.textContent = n;
        numberBox.appendChild(tile);
      }
      clearAnswer();
    }

    function insert(symbol) {
      const start = input.selectionStart;
      const end = input.selectionEnd;
      input.setRangeText(symbol, start, end, 'end');
      input.focus();
    }
    function clearAnswer() {
      input.value = '';
      message.textContent = '';
      input.focus();
    }
    function showSolution() {
      message.style.color = '#a6dfff';
      message.textContent = 'ตัวอย่างเฉลย: ' + current.solution
        .replaceAll('*','×').replaceAll('/','÷');
    }

    // ตรวจสูตรด้วย parser ของเราเอง ปลอดภัยกว่า eval()
    function calculateAnswer(raw) {
      const source = raw.replace(/\s/g,'').replaceAll('×','*')
        .replaceAll('÷','/').replaceAll('−','-');
      const tokens = source.match(/\d+|[()+*/-]/g);
      if (!tokens || tokens.join('') !== source) throw Error('มีอักขระที่ไม่รองรับ');
      const used = tokens.filter(t => /^\d+$/.test(t)).map(Number);
      if (used.length !== 4 || !sameNumbers(used, current.nums))
        throw Error('ต้องใช้เลขที่กำหนดครบทั้ง 4 ตัว ตัวละหนึ่งครั้ง');
      let pos = 0;
      function atom() {
        const token = tokens[pos++];
        if (token === '(') {
          const value = expression();
          if (tokens[pos++] !== ')') throw Error('วงเล็บไม่ถูกต้อง');
          return value;
        }
        if (token && /^\d+$/.test(token)) return fraction(BigInt(token));
        throw Error('รูปแบบสูตรไม่ถูกต้อง');
      }
      function term() {
        let result = atom();
        while (tokens[pos] === '*' || tokens[pos] === '/') {
          const op = tokens[pos++];
          const right = atom();
          result = op === '*' ? multiply(result, right) : divide(result, right);
        }
        return result;
      }
      function expression() {
        let result = term();
        while (tokens[pos] === '+' || tokens[pos] === '-') {
          const op = tokens[pos++];
          const right = term();
          result = op === '+' ? add(result, right) : subtract(result, right);
        }
        return result;
      }
      const result = expression();
      if (pos !== tokens.length) throw Error('รูปแบบสูตรไม่ถูกต้อง');
      return result;
    }
    function checkAnswer() {
      try {
        const result = calculateAnswer(input.value);
        if (is24(result)) {
          message.style.color = '#8cf0b1';
          message.textContent = '🎉 ถูกต้อง! ได้ 24 พอดี';
        } else {
          message.style.color = '#ffbcae';
          message.textContent = `ยังไม่ใช่ 24 ครับ (ได้ ${result.n}/${result.d}) ลองอีกที!`;
        }
      } catch (error) {
        message.style.color = '#ffbcae';
        message.textContent = error.message;
      }
    }
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') checkAnswer();
    });
    newQuestion();
  </script>
</body>
</html>
