<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>Math 24 Advanced</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: #fafafa; color: #151515;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, select:focus-visible { outline: 2px solid #222; outline-offset: 3px; }
    .page { max-width: 604px; padding: 30px 14px 42px; margin: auto; }
    header { text-align: center; margin: 0 0 22px; }
    header h1 { margin: 0 0 6px; font-size: clamp(29px, 6.6vw, 38px);
      letter-spacing: -.06em; line-height: 1.2; font-weight: 800; }
    header p { margin: 0; font-size: 13px; color: #717171; }
    .game { padding: 25px 25px 27px; border: 1px solid #e8e8e8;
      background: #fff; border-radius: 22px; box-shadow: 0 12px 36px #00000005; }
    .mode-row { display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font-size: 13px; font-weight: 600; }
    select { max-width: 248px; width: 65%; border-radius: 10px; border: 1px solid #d3d3d3;
      background: #fff; color: #181818; padding: 10px 12px; font-size: 13px; }
    .target { margin: 23px 0 14px; text-align: center; font-weight: 750; font-size: 17px; }
    .numbers { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 9px; margin-bottom: 22px; }
    .tile { border: 1.5px solid #181818; border-radius: 13px; background: #fff;
      display: grid; place-items: center; min-height: 74px;
      font-size: clamp(27px,7vw,39px); font-weight: 750; line-height: 1;
      font-variant-numeric: tabular-nums; }
    .answer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .answer-label { display: block; font-size: 13px; font-weight: 700; }
    .clear-link { border: 0; background: transparent; padding: 2px 4px;
      color: #787878; text-decoration: underline; text-underline-offset: 3px;
      font-size: 12px; font-weight: 500; }
    .clear-link:hover { color: #161616; }
    .formula-field { position: relative; min-height: 68px; border: 1.5px solid #262626;
      border-radius: 13px; background: #fff; cursor: text;
      display: flex; align-items: center; padding: 8px 15px; overflow-x: auto; }
    .formula-field:focus-within { box-shadow: 0 0 0 2px #e5e5e5; }
    #answer { position: absolute; left: 0; top: 0; width: 1px; height: 1px;
      opacity: 0; z-index: -1; pointer-events: none; }
    .formula-visual { display: flex; align-items: baseline; justify-content: center;
      white-space: nowrap; min-width: 100%; min-height: 37px;
      font-size: 24px; font-weight: 600; line-height: 1.35;
      font-variant-numeric: lining-nums tabular-nums; user-select: none; }
    .formula-text { white-space: pre; }
    .formula-text[data-pos] { cursor: text; }
    .placeholder { color: #9c9c9c; font-weight: 400; font-size: 17px; }
    .sup-group { display: inline-flex; align-items: baseline; vertical-align: super;
      font-size: .64em; line-height: 1.0; min-height: 15px;
      margin-left: 1px; margin-right: 1px; font-weight: 650;
      position: relative; top: -.4em; }
    .sup-group:empty::before { content: ' '; display: inline-block; width: 10px; }
    .math-caret { display: inline-block; vertical-align: -2px; background: #151515;
      flex: 0 0 auto; width: 2px; height: 26px; margin-inline: 1px;
      animation: caret-blink 1s steps(1) infinite; }
    .sup-group .math-caret { width: 14px; height: 2px; margin-inline: 1px;
      vertical-align: 3px; align-self: center; }
    @keyframes caret-blink { 50% { opacity: 0; } }
    .hint { font-size: 11px; line-height: 1.55; color: #777; text-align: center; margin: 9px 4px 0; }
    .keypads { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr);
      gap: 13px; margin-top: 23px; }
    .pad { min-width: 0; }
    .ops-pad { border-left: 1px solid #e7e7e7; padding-left: 13px; }
    .key-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 7px; }
    .key { display: grid; place-items: center; min-width: 0; min-height: 51px;
      padding: 4px 1px; border-radius: 10px; border: 1px solid #e0e0e0;
      background: #f7f7f7; color: #191919; font-size: 21px; font-weight: 650;
      transition: background .12s ease; }
    .key:hover { background: #ececec; }
    .key:active { background: #dcdcdc; transform: scale(.97); }
    .key.utility { font-size: 14px; color: #555; background: #f0f0f0; }
    .key.dark { background: #171717; color: #fff; border-color: #171717; }
    .key.dark:hover { background: #424242; }
    .key[disabled] { opacity: .25; cursor: not-allowed; }
    .key-spacer { pointer-events: none; }
    .key sup { font-size: 12px; vertical-align: super; }
    .actions { display: grid; grid-template-columns: 1.2fr 1fr 1fr;
      gap: 9px; margin-top: 19px; }
    .action { border: 1px solid #dedede; border-radius: 11px; background: #fff;
      color: #151515; min-height: 48px; font-size: 13px; font-weight: 700; padding: 8px 5px; }
    .action:hover { background: #f3f3f3; }
    .action:active { transform: scale(.98); }
    .action.primary { background: #151515; color: #fff; border-color: #151515; }
    .action.primary:hover { background: #3a3a3a; }
    #message { min-height: 49px; margin: 18px 0 0; padding: 12px;
      border: 1px solid #ebebeb; border-radius: 11px; background: #fafafa;
      font-size: 13px; text-align: center; line-height: 1.55; overflow-wrap: anywhere; }
    #message[data-status="success"] { border-color: #303030; background: #f1f1f1; font-weight: 700; }
    #message[data-status="error"] { border-style: dashed; }
    .solution-math { font-size: 17px; font-weight: 700; display: inline-block; padding-left: 3px; }
    .rules { max-width: 600px; margin: 17px auto 0; text-align: center;
      font-size: 12px; line-height: 1.7; color: #777; }
    @media (min-width: 720px) {
      .page { padding-top: 46px; }
      .game { padding: 32px 35px 29px; }
      .key { min-height: 55px; }
    }
    @media (max-width: 400px) {
      .page { padding: 19px 9px 26px; }
      .game { padding: 17px 13px 19px; border-radius: 16px; }
      .target { font-size: 15px; margin-top: 21px; }
      .tile { min-height: 66px; border-radius: 11px; }
      .keypads { gap: 8px; margin-top: 20px; }
      .ops-pad { padding-left: 8px; }
      .key-grid { gap: 5px; }
      .key { min-height: 46px; border-radius: 8px; font-size: 20px; }
      .key.utility { font-size: 12px; }
      .actions { gap: 7px; }
      .action { font-size: 12px; }
      .formula-visual { font-size: 22px; }
    }
    @media (prefers-reduced-motion: reduce) { .math-caret { animation: none; } }
  </style>
</head>
<body>
<main class="page">
  <header>
    <h1>Math 24 Advanced</h1>
    <p>เกมคณิตศาสตร์ 24 สำหรับมัธยมปลาย</p>
  </header>
  <section class="game" aria-label="เกมคณิตศาสตร์ 24">
    <div class="mode-row">
      <label for="mode">ระดับการเล่น</label>
      <select id="mode">
        <option value="basic">พื้นฐาน (+ − × ÷)</option>
        <option value="advanced">ขั้นสูง (√ ! ยกกำลัง)</option>
      </select>
    </div>
    <p class="target">ใช้เลขทั้ง 4 ตัวให้ได้ 24</p>
    <div class="numbers" id="numbers" aria-label="ตัวเลขโจทย์"></div>
    <div class="answer-head">
      <label class="answer-label" for="answer">สูตรของคุณ</label>
      <button type="button" class="clear-link" id="clear">ล้างสูตร</button>
    </div>
    <div class="formula-field" id="formula-field" aria-label="แตะเพื่อพิมพ์สูตร">
      <input id="answer" type="text" aria-label="สูตรคณิตศาสตร์" autocomplete="off"
        autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text">
      <div class="formula-visual" id="formula-visual" aria-hidden="true"></div>
    </div>
    <p class="hint" id="entry-hint">พิมพ์ด้วยคีย์บอร์ด หรือกดปุ่มด้านล่างได้</p>
    <div class="keypads">
      <section class="pad" aria-label="แป้นตัวเลข">
        <div class="key-grid">
          <button type="button" class="key" data-insert="1">1</button>
          <button type="button" class="key" data-insert="2">2</button>
          <button type="button" class="key" data-insert="3">3</button>
          <button type="button" class="key" data-insert="4">4</button>
          <button type="button" class="key" data-insert="5">5</button>
          <button type="button" class="key" data-insert="6">6</button>
          <button type="button" class="key" data-insert="7">7</button>
          <button type="button" class="key" data-insert="8">8</button>
          <button type="button" class="key" data-insert="9">9</button>
          <span class="key-spacer" aria-hidden="true"></span>
          <button type="button" class="key" data-insert="0">0</button>
          <span class="key-spacer" aria-hidden="true"></span>
        </div>
      </section>
      <section class="pad ops-pad" aria-label="แป้นเครื่องหมาย">
        <div class="key-grid">
          <button type="button" class="key" data-insert="+">+</button>
          <button type="button" class="key" data-insert="-">−</button>
          <button type="button" class="key" data-insert="*">×</button>
          <button type="button" class="key" data-insert="/">÷</button>
          <button type="button" class="key special" id="power-key" aria-label="ยกกำลัง"><span>x<sup>n</sup></span></button>
          <button type="button" class="key special" data-insert="√(" aria-label="รากที่สอง">√</button>
          <button type="button" class="key special" data-insert="!">!</button>
          <button type="button" class="key" data-insert="(">(</button>
          <button type="button" class="key" data-insert=")">)</button>
          <button type="button" class="key utility" id="backspace" aria-label="ลบหนึ่งตัว">⌫</button>
          <button type="button" class="key utility" id="exit-exponent" aria-label="ออกจากเลขชี้กำลังหรือเลื่อนเคอร์เซอร์ไปขวา">→</button>
          <button type="button" class="key dark" id="equal" aria-label="ตรวจคำตอบ">=</button>
        </div>
      </section>
    </div>
    <div class="actions">
      <button type="button" class="action primary" id="check">ตรวจคำตอบ</button>
      <button type="button" class="action" id="new">สุ่มโจทย์</button>
      <button type="button" class="action" id="solution">เฉลย</button>
    </div>
    <p id="message" aria-live="polite">พร้อมเล่นแล้ว!</p>
  </section>
  <p class="rules" id="rules">ใช้เลขบนการ์ดครบทั้ง 4 ตัว ตัวละหนึ่งครั้ง และทำให้ได้ 24 พอดี</p>
</main>
<script>
    'use strict';
    const numberBox = document.getElementById('numbers');
    const input = document.getElementById('answer');
    const message = document.getElementById('message');
    const modeSelect = document.getElementById('mode');
    const MAX = 1000000000n; // จำกัดค่าระหว่างทาง ป้องกันตัวเลขมหาศาล
    let current = null;

    // ใช้เศษส่วนแบบ BigInt เพื่อไม่ต้องปัดเศษในการตัดสินคำตอบ
    function abs(n) { return n < 0n ? -n : n; }
    function gcd(a, b) {
      a = abs(a); b = abs(b);
      while (b !== 0n) [a, b] = [b, a % b];
      return a;
    }
    function fraction(n, d = 1n) {
      if (d === 0n) throw Error('ห้ามหารด้วยศูนย์');
      if (d < 0n) { n = -n; d = -d; }
      const g = gcd(n, d);
      if (g !== 0n) { n /= g; d /= g; }
      if (abs(n) > MAX || d > MAX) throw Error('ตัวเลขระหว่างคำนวณใหญ่เกินไป');
      return { n, d };
    }
    const add = (a,b) => fraction(a.n*b.d+b.n*a.d, a.d*b.d);
    const subtract = (a,b) => fraction(a.n*b.d-b.n*a.d, a.d*b.d);
    const multiply = (a,b) => fraction(a.n*b.n, a.d*b.d);
    const divide = (a,b) => fraction(a.n*b.d, a.d*b.n);
    const is24 = x => x.n === 24n*x.d;

    function factorial(a) {
      if (a.d !== 1n || a.n < 0n || a.n > 6n)
        throw Error('แฟกทอเรียล (!) ใช้ได้กับจำนวนเต็ม 0 ถึง 6');
      let result = 1n;
      for (let i = 2n; i <= a.n; i++) result *= i;
      return fraction(result);
    }
    function squareRoot(a) {
      if (a.n < 0n) throw Error('√ ใช้กับจำนวนติดลบไม่ได้ในเกมนี้');
      const rN = BigInt(Math.floor(Math.sqrt(Number(a.n))));
      const rD = BigInt(Math.floor(Math.sqrt(Number(a.d))));
      if (rN*rN !== a.n || rD*rD !== a.d)
        throw Error('√ ต้องได้ผลลัพธ์เป็นจำนวนตรรกยะที่คำนวณได้ตรงตัว');
      return fraction(rN, rD);
    }
    function power(a, b) {
      if (b.d !== 1n || b.n < -4n || b.n > 4n)
        throw Error('เลขชี้กำลังต้องเป็นจำนวนเต็มตั้งแต่ −4 ถึง 4');
      if (a.n === 0n && b.n <= 0n) throw Error('ไม่อนุญาตให้ยกกำลังศูนย์หรือติดลบจากฐาน 0');
      const exp = abs(b.n);
      return b.n >= 0n
        ? fraction(a.n**exp, a.d**exp)
        : fraction(a.d**exp, a.n**exp);
    }
    function sameNumbers(a, b) {
      return [...a].sort((x,y)=>x-y).join(',') ===
             [...b].sort((x,y)=>x-y).join(',');
    }

    // แปลงสูตรของผู้เล่นเป็นคำตอบอย่างปลอดภัย ไม่ใช้ eval()
    function calculateAnswer(raw, nums = current.nums, mode = modeSelect.value) {
      const source = raw.replace(/\s/g, '').replaceAll('×','*')
        .replaceAll('÷','/').replaceAll('−','-');
      const tokens = source.match(/\d+|[()+*/^!√-]/g);
      if (!tokens || tokens.join('') !== source)
        throw Error('มีสัญลักษณ์ที่ไม่รองรับ');
      if (mode === 'basic' && /[√!^]/.test(source))
        throw Error('เครื่องหมาย √ ! ^ ใช้ได้ในโหมดขั้นสูงเท่านั้น');
      if (['√','!','^'].some(op => tokens.filter(t => t === op).length > 1))
        throw Error('ใช้ √ ! และ ^ ได้อย่างละไม่เกินหนึ่งครั้งต่อสูตร');
      const numberTokens = tokens.filter(t => /^\d+$/.test(t));
      if (numberTokens.some(t => t.length !== 1))
        throw Error('ห้ามนำตัวเลขมาต่อกัน ต้องใช้ทีละหนึ่งหลัก');
      const used = numberTokens.map(Number);
      if (used.length !== 4 || !sameNumbers(used, nums))
        throw Error('ต้องใช้เลขบนการ์ดให้ครบทั้ง 4 ตัว ตัวละหนึ่งครั้ง');
      let pos = 0;
      function primary() {
        const t = tokens[pos++];
        if (t === '(') {
          const value = expression();
          if (tokens[pos++] !== ')') throw Error('วงเล็บไม่ถูกต้อง');
          return value;
        }
        if (t && /^\d+$/.test(t)) return fraction(BigInt(t));
        throw Error('รูปแบบสูตรไม่ถูกต้อง');
      }
      function postfix() {
        let value = primary();
        while (tokens[pos] === '!') { pos++; value = factorial(value); }
        return value;
      }
      function exponent() {
        let value = postfix();
        if (tokens[pos] === '^') {
          pos++;
          value = power(value, unary()); // ยกกำลังชิดขวา
        }
        return value;
      }
      function unary() {
        if (tokens[pos] === '√') { pos++; return squareRoot(unary()); }
        return exponent();
      }
      function term() {
        let value = unary();
        while (tokens[pos] === '*' || tokens[pos] === '/') {
          const op = tokens[pos++];
          const right = unary();
          value = op === '*' ? multiply(value, right) : divide(value, right);
        }
        return value;
      }
      function expression() {
        let value = term();
        while (tokens[pos] === '+' || tokens[pos] === '-') {
          const op = tokens[pos++];
          const right = term();
          value = op === '+' ? add(value, right) : subtract(value, right);
        }
        return value;
      }
      const result = expression();
      if (pos !== tokens.length) throw Error('รูปแบบสูตรไม่ถูกต้อง');
      return result;
    }

    // Solver พื้นฐาน: เลือก 2 ก้อนมารวม แล้วค้นหาต่อจนได้ 24
    // รับก้อนที่ผ่าน √, ! หรือ ^ มาแล้วได้ จึงใช้สร้างโจทย์ขั้นสูงได้ด้วย
    function findSolutionFromNodes(start) {
      const failed = new Set();
      function solve(items) {
        if (items.length === 1) return is24(items[0].value) ? items[0].text : null;
        const signature = items.map(x => `${x.value.n}/${x.value.d}`).sort().join('|');
        if (failed.has(signature)) return null;
        for (let i = 0; i < items.length; i++) {
          for (let j = i + 1; j < items.length; j++) {
            const a = items[i], b = items[j];
            const rest = items.filter((_, k) => k !== i && k !== j);
            const choices = [
              [add, a, b, '+'], [subtract, a, b, '-'], [subtract, b, a, '-'],
              [multiply, a, b, '*'], [divide, a, b, '/'], [divide, b, a, '/']
            ];
            for (const [op, left, right, symbol] of choices) {
              let value;
              try { value = op(left.value, right.value); }
              catch { continue; }
              const node = {value, text:`(${left.text}${symbol}${right.text})`};
              const solution = solve([...rest, node]);
              if (solution !== null) return solution;
            }
          }
        }
        failed.add(signature);
        return null;
      }
      return solve(start);
    }
    function numberNodes(nums) {
      return nums.map(n => ({ value:fraction(BigInt(n)), text:String(n) }));
    }
    function findBasicSolution(nums) {
      return findSolutionFromNodes(numberNodes(nums));
    }

    // สร้างสูตรขั้นสูงจาก 1 เครื่องหมายพิเศษ + Solver พื้นฐาน
    // คืนเฉพาะสูตรที่ตรวจซ้ำแล้วว่าได้ 24 และใช้เลขครบทุกตัว
    function findAdvancedSolution(nums, special) {
      const nodes = numberNodes(nums);
      if (special === '!') {
        for (let i = 0; i < 4; i++) {
          if (nums[i] < 3 || nums[i] > 6) continue;
          const changed = nodes.map((node, k) => k === i
            ? {value:factorial(node.value), text:`(${node.text}!)`} : node);
          const solution = findSolutionFromNodes(changed);
          if (solution !== null) return solution;
        }
      }
      if (special === '√') {
        for (let i = 0; i < 4; i++) {
          if (nums[i] !== 4 && nums[i] !== 9) continue;
          const changed = nodes.map((node, k) => k === i
            ? {value:squareRoot(node.value), text:`√(${node.text})`} : node);
          const solution = findSolutionFromNodes(changed);
          if (solution !== null) return solution;
        }
      }
      if (special === '^') {
        for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
          if (i === j || nums[i] < 2 || nums[j] < 2 || nums[j] > 4) continue;
          let value;
          try { value = power(nodes[i].value, nodes[j].value); }
          catch { continue; }
          const rest = nodes.filter((_, k) => k !== i && k !== j);
          const solution = findSolutionFromNodes([
            ...rest, {value, text:`(${nums[i]}^${nums[j]})`}
          ]);
          if (solution !== null) return solution;
        }
      }
      return null;
    }

    const fallbacks = {
      basic: {nums:[1,2,3,4], solution:'1*2*3*4'},
      '!': {nums:[4,3,2,1], solution:'4!*(3-2)*1'},
      '√': {nums:[9,2,4,1], solution:'√(9)*2*4*1'},
      '^': {nums:[2,3,4,1], solution:'(2^3)*(4-1)'}
    };
    const specials = ['!', '√', '^'];
    const randomDigit = () => Math.floor(Math.random()*10);
    function shuffle(items) {
      for (let i = items.length-1; i > 0; i--) {
        const j = Math.floor(Math.random()*(i+1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      return items;
    }
    function makeCandidate(special) {
      if (special === '!') return shuffle([3 + Math.floor(Math.random()*4),randomDigit(),randomDigit(),randomDigit()]);
      if (special === '√') return shuffle([Math.random() < .5 ? 4 : 9,randomDigit(),randomDigit(),randomDigit()]);
      if (special === '^') return shuffle([2+Math.floor(Math.random()*7),2+Math.floor(Math.random()*3),randomDigit(),randomDigit()]);
      return Array.from({length:4},randomDigit);
    }
    function newQuestion() {
      const mode = modeSelect.value;
      const special = mode === 'advanced' ? specials[Math.floor(Math.random()*specials.length)] : 'basic';
      let found = null;
      for (let tries = 0; tries < 220; tries++) {
        const nums = makeCandidate(special);
        if (current && sameNumbers(nums,current.nums)) continue;
        const solution = mode === 'advanced'
          ? findAdvancedSolution(nums,special) : findBasicSolution(nums);
        if (solution === null) continue;
        try {
          if (is24(calculateAnswer(solution,nums,mode))) {
            found = {nums,solution,special}; break;
          }
        } catch { /* ป้องกันไม่ให้โจทย์ที่ไม่ผ่านกติกาหลุดไปแสดง */ }
      }
      if (!found) {
        const fallback = fallbacks[special];
        found = {...fallback,special};
      }
      current = found;
      numberBox.replaceChildren();
      for (const n of current.nums) {
        const tile = document.createElement('div');
        tile.className = 'tile'; tile.textContent = n;
        numberBox.appendChild(tile);
      }
      clearAnswer();
      if (mode === 'advanced') setMessage('โจทย์ขั้นสูง: มีเฉลยที่ใช้ ' + special + ' แน่นอน', 'hint');
      else setMessage('โจทย์ใหม่พร้อมแล้ว ลองทำให้ได้ 24!', 'hint');
    }

    function setMessage(text, status = '') {
      message.textContent = text;
      message.dataset.status = status;
    }

    // แสดงสูตรแบบคณิตศาสตร์จริง โดยเก็บข้อความดิบไว้ตรวจคำตอบ
    const field = document.getElementById('formula-field');
    const visual = document.getElementById('formula-visual');
    const entryHint = document.getElementById('entry-hint');
    let cursor = 0;
    let editing = false;

    function closingParen(str, open) {
      let depth = 0;
      for (let k = open; k < str.length; k++) {
        if (str[k] === '(') depth++;
        if (str[k] === ')') {
          depth--;
          if (depth === 0) return k;
        }
      }
      return -1;
    }
    function powerGroups(str = input.value) {
      const groups = [];
      for (let i = 0; i < str.length - 1; i++) {
        if (str[i] === '^' && str[i+1] === '(') {
          const close = closingParen(str, i+1);
          if (close >= 0) groups.push({start:i, inside:i+2, close, after:close+1});
        }
      }
      return groups;
    }
    function currentPower() {
      return powerGroups().filter(g => cursor >= g.inside && cursor <= g.close)
        .sort((a,b)=>b.start-a.start)[0] || null;
    }
    function displayChar(ch) {
      return ch === '*' ? '×' : ch === '/' ? '÷' : ch === '-' ? '−' : ch;
    }
    function addCaret(parent, exponent) {
      if (!editing) return;
      const caret = document.createElement('span');
      caret.className = 'math-caret';
      caret.setAttribute('aria-hidden', 'true');
      parent.appendChild(caret);
    }
    function addMathText(parent, str, withCaret = false, startAt = 0) {
      function draw(begin, end, target) {
        let i = begin;
        while (i < end) {
          if (withCaret && cursor === i) addCaret(target);
          if (str[i] === '^' && str[i+1] === '(') {
            const close = closingParen(str, i+1);
            if (close >= 0 && close < end) {
              const sup = document.createElement('sup');
              sup.className = 'sup-group';
              draw(i+2, close, sup);
              target.appendChild(sup);
              i = close + 1;
              continue;
            }
          }
          const text = document.createElement('span');
          text.className = 'formula-text';
          text.textContent = displayChar(str[i]);
          text.dataset.pos = String(i);
          target.appendChild(text);
          i++;
        }
        if (withCaret && cursor === end) addCaret(target);
      }
      draw(0, str.length, parent);
    }
    function renderFormula() {
      visual.replaceChildren();
      const raw = input.value;
      if (!raw) {
        if (editing) addCaret(visual);
        const placeholder = document.createElement('span');
        placeholder.className = 'placeholder';
        placeholder.textContent = 'เช่น (1+2+3)×4';
        visual.appendChild(placeholder);
      } else addMathText(visual, raw, true);
      const group = currentPower();
      entryHint.textContent = group
        ? 'กำลังพิมพ์เลขชี้กำลัง · กด → หรือ ) เพื่อกลับมาพิมพ์ตามปกติ'
        : 'พิมพ์ด้วยคีย์บอร์ด หรือกดปุ่มด้านล่างได้';
      const caret = visual.querySelector('.math-caret');
      if (caret) caret.scrollIntoView({block:'nearest',inline:'nearest'});
    }
    function setCursor(pos, focus = false) {
      cursor = Math.max(0, Math.min(pos, input.value.length));
      input.setSelectionRange(cursor, cursor);
      editing = true;
      if (focus) input.focus({preventScroll:true});
      renderFormula();
    }
    function syncCursor() {
      if (document.activeElement !== input) return;
      cursor = input.selectionStart ?? input.value.length;
      editing = true;
      renderFormula();
    }
    function replaceSelection(text, positionOffset = text.length) {
      const start = document.activeElement === input ? input.selectionStart : cursor;
      const end = document.activeElement === input ? input.selectionEnd : cursor;
      input.setRangeText(text, start, end, 'end');
      setCursor(start + positionOffset);
    }
    function insert(symbol) {
      if (symbol === ')' && currentPower() && cursor === currentPower().close) {
        exitPower(); return;
      }
      replaceSelection(symbol);
    }
    function insertPower() {
      if (modeSelect.value !== 'advanced') return;
      const before = input.value.slice(0, cursor);
      if (!/[\d)!]$/.test(before)) {
        setMessage('ใส่เลขฐานก่อนกดยกกำลัง เช่น 2 แล้วกด xⁿ', 'error'); return;
      }
      replaceSelection('^()', 2);
    }
    function exitPower() {
      const group = currentPower();
      if (group) setCursor(group.after);
      else moveCursor(1);
    }
    function validPositions() {
      const allowed = Array.from({length:input.value.length+1},(_,i)=>i);
      const disallowed = new Set(powerGroups().map(g=>g.start+1));
      return allowed.filter(p => !disallowed.has(p));
    }
    function moveCursor(direction) {
      const positions = validPositions();
      if (direction > 0) setCursor(positions.find(p=>p>cursor) ?? input.value.length);
      else setCursor([...positions].reverse().find(p=>p<cursor) ?? 0);
    }
    function backspace() {
      const s = document.activeElement === input ? input.selectionStart : cursor;
      const e = document.activeElement === input ? input.selectionEnd : cursor;
      if (s !== e) { input.setRangeText('',s,e,'end'); setCursor(s); return; }
      const group = powerGroups().find(g => (s === g.inside && g.inside === g.close) || s === g.after);
      if (group) {
        input.setRangeText('',group.start,group.after,'end');
        setCursor(group.start); return;
      }
      if (s > 0) { input.setRangeText('',s-1,s,'end'); setCursor(s-1); }
    }
    function clearAnswer() {
      input.value = '';
      cursor = 0;
      editing = false;
      renderFormula();
      setMessage('พร้อมเริ่มโจทย์ใหม่', 'hint');
    }
    function showSolution() {
      setMessage('ตัวอย่างเฉลย: ', 'hint');
      const expr = current.solution.replace(/\^(-?\d)/g, '^($1)');
      const out = document.createElement('span');
      out.className = 'solution-math';
      addMathText(out, expr);
      message.appendChild(out);
    }
    function checkAnswer() {
      try {
        const value = calculateAnswer(input.value);
        if (is24(value)) setMessage('✓ ถูกต้อง! ได้ 24 พอดี 🎉', 'success');
        else setMessage('ยังไม่ใช่ 24 (ได้ ' +
          (value.d === 1n ? String(value.n) : `${value.n}/${value.d}`) + ') ลองอีกครั้ง!', 'error');
      } catch (error) { setMessage(error.message, 'error'); }
    }

    // ปุ่มในเว็บ: ไม่ต้องเปิดคีย์บอร์ดมือถือทุกครั้งที่แตะ
    document.querySelectorAll('[data-insert]').forEach(button => {
      button.addEventListener('click', () => { input.blur(); insert(button.dataset.insert); });
    });
    document.getElementById('power-key').addEventListener('click', () => { input.blur(); insertPower(); });
    document.getElementById('backspace').addEventListener('click', () => { input.blur(); backspace(); });
    document.getElementById('clear').addEventListener('click', clearAnswer);
    document.getElementById('exit-exponent').addEventListener('click', () => { input.blur(); exitPower(); });
    document.getElementById('equal').addEventListener('click', checkAnswer);
    document.getElementById('check').addEventListener('click', checkAnswer);
    document.getElementById('new').addEventListener('click', newQuestion);
    document.getElementById('solution').addEventListener('click', showSolution);
    field.addEventListener('click', e => {
      if (e.target.dataset.pos !== undefined) {
        const char = e.target;
        const mid = char.getBoundingClientRect().left + char.getBoundingClientRect().width/2;
        setCursor(Number(char.dataset.pos) + (e.clientX>mid?1:0), true);
      } else setCursor(input.value.length, true);
    });
    input.addEventListener('focus', syncCursor);
    input.addEventListener('click', syncCursor);
    input.addEventListener('keyup', syncCursor);
    document.addEventListener('selectionchange', syncCursor);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
      else if (e.key === '^') { e.preventDefault(); insertPower(); }
      else if (e.key === 'x' || e.key === 'X') { e.preventDefault(); insert('*'); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); moveCursor(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); moveCursor(-1); }
      else if (e.key === 'Backspace') { e.preventDefault(); backspace(); }
      else if (e.key === ')' && currentPower() && cursor === currentPower().close) {
        e.preventDefault(); exitPower();
      }
      else if (e.key === ' ' && currentPower()) { e.preventDefault(); exitPower(); }
    });
    input.addEventListener('input', () => {
      // รองรับสัญลักษณ์คูณที่พิมพ์จากมือถือ และ ^ แบบคีย์บอร์ดเสมือน
      let pos = input.selectionStart;
      const raw = input.value;
      const converted = raw.replace(/[×xX]/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      if (converted !== raw) {
        input.value = converted; input.setSelectionRange(pos,pos);
      }
      const raw2 = input.value;
      if (raw2[pos-1] === '^' && raw2[pos] !== '(') {
        input.setRangeText('()',pos,pos,'end');
        pos++;
        input.setSelectionRange(pos,pos);
      }
      cursor = input.selectionStart;
      editing = true;
      renderFormula();
    });
    modeSelect.addEventListener('change', () => {
      const advanced = modeSelect.value === 'advanced';
      document.querySelectorAll('.special').forEach(button => button.disabled = !advanced);
      document.getElementById('rules').textContent = advanced
        ? 'ใช้เลขครบ 4 ตัว ตัวละหนึ่งครั้ง · √ ต้องถอดได้พอดี · ! สำหรับ 0–6 · เลขชี้กำลัง −4 ถึง 4 · เครื่องหมายพิเศษใช้ได้อย่างละ 1 ครั้ง'
        : 'ใช้เลขบนการ์ดครบ 4 ตัว ตัวละหนึ่งครั้ง · ใช้ + − × ÷ และวงเล็บ · ต้องได้ 24 พอดี';
      newQuestion();
    });
    document.querySelectorAll('.special').forEach(button => button.disabled = true);
    newQuestion();
  </script>
</body>
</html>
